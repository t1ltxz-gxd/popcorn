name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  build-and-test:
    name: Build & Test (Windows - ${{ matrix.rust }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg installed artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-glib-pkgconf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-glib-pkgconf-

      - name: Install C dependencies (Windows)
        run: |
          vcpkg install glib:x64-windows pkgconf:x64-windows
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  lint:
    name: Lint & Format (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg installed artifacts
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-glib-pkgconf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-glib-pkgconf-

      - name: Install C dependencies (Windows)
        run: |
          vcpkg install glib:x64-windows pkgconf:x64-windows
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig" >> $GITHUB_ENV

      - name: Setup Rust with Clippy & Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --verbose -- -D warnings

  security-audit:
    name: Security Audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit (prebuilt binary)
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit
        run: cargo audit

  dependency-checks:
    name: Dependency Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny (prebuilt binary)
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check
