name: Continuous Deployment

on:
  workflow_run:
    workflows: [Continuous Integration]
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'

jobs:
  prepare-release:
    name: Prepare Release Metadata
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      changelog: ${{ steps.extract-changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: get-version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | awk -F '"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for current version
        id: extract-changelog
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          CHANGELOG=$(awk -v ver="## $VERSION" '
          BEGIN { found=0; }
          $0 ~ "^" ver { found=1; next; }
          found && $0 ~ /^## / { exit; }
          found { print; }
          ' CHANGELOG.md)

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

  build-and-release:
    name: Build & Release (Windows)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies (Windows)
        run: |
          vcpkg install glib:x64-windows pkgconf:x64-windows
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        shell: powershell
        run: |
          $BIN_NAME = "popcorn"
          $VERSION = "${{ needs.prepare-release.outputs.version }}"
          $ZIP_NAME = "$BIN_NAME-v$VERSION-x86_64-pc-windows-msvc.zip"

          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "target\release\$BIN_NAME.exe" -DestinationPath "dist\$ZIP_NAME"

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: Release v${{ needs.prepare-release.outputs.version }}
          body: ${{ needs.prepare-release.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
