[package]
name = "popcorn"
version = "0.1.0"
edition = "2024"
authors = ["t1ltxz.gxd? <git@t1ltxz.ninja>"]
description = "{{description}}"
license = "MIT"
repository = "https://github.com/t1lxz-gxd/popcorn"
keywords = ["rust", "template"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[dependencies]
notify = "8.2.0"
open = "5.4.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tray-icon = "0.24.1"
anyhow = "1.0.103"
dirs = "6.0.0"
tao = "0.36.0"
windows = { version = "0.62.2", features = [
  "Win32",
  "Win32_System",
  "Win32_UI",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading"
] }
ureq = { version = "3.3.0", features = ["json"] }
enigo = "0.6.1"
active-win-pos-rs = "0.11.0"
rdev = "0.5"
image = "0.25.10"
once_cell = "1.21.4"
ctrlc = "3.4.2"

[build-dependencies]
image = "0.25.10"
winresource = "0.1.31"
